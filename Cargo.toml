[package]
authors = ["Stefan Kerkmann"]
name = "dlpc8445_flasher"
version = "0.2.2"
edition = "2024"

[lib]
name = "dlpc8445_proto"
path = "src/lib.rs"

[[bin]]
name = "dlpc8445_flasher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
binrw = "0.15.1"
bitfield-struct = "0.13.0"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
git-version = "0.3.9"
log = "0.4.29"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"

# native
[target.'cfg(not(target_family = "wasm"))'.dependencies]
nusb = { version = "0.2.3", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["full"] }

# web
[target.'cfg(target_family = "wasm")'.dependencies]
webusb-web = "0.5.1"
tokio = { version = "1.52.3", features = ["time"] }
