[package]
authors = ["Stefan Kerkmann"]
name = "dlpc8445_proto"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
binrw = "0.15.1"
bitfield-struct = "0.13.0"
log = "0.4.29"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"

# native
[target.'cfg(not(target_family = "wasm"))'.dependencies]
nusb = { version = "0.2.3", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["full"] }

# web
[target.'cfg(target_family = "wasm")'.dependencies]
webusb-web = "0.5.1"
gloo-timers = { version = "0.4.0", features = ["futures"] }
tokio = { version = "1.52.3", features = ["sync", "macros"] }
